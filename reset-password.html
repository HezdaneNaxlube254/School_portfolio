<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | Kayn Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal-body">

  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="cardTitle">Reset Password</h1>
      <p class="sub" id="cardSub">We'll send you a link to set a new password.</p>

      <div id="requestWrap" class="auth-form">
        <div id="errorRequest" class="auth-error" hidden></div>
        <div id="infoRequest" class="auth-info" hidden></div>
        <label>
          <span>Email</span>
          <input type="email" id="resetEmail" autocomplete="email" required>
        </label>
        <button id="btnRequest" type="button" class="btn btn-primary">
          <span class="btn-label">Send Reset Link</span>
        </button>
      </div>

      <form id="updateWrap" class="auth-form" hidden novalidate>
        <div id="errorUpdate" class="auth-error" hidden></div>
        <label>
          <span>New Password</span>
          <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          <span>Confirm New Password</span>
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit" class="btn btn-primary">
          <span class="btn-label">Set New Password</span>
        </button>
      </form>

      <a class="auth-back" href="client-login.html">&larr; Back to sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const requestWrap = document.getElementById('requestWrap');
      const updateWrap  = document.getElementById('updateWrap');
      const cardTitle   = document.getElementById('cardTitle');
      const cardSub     = document.getElementById('cardSub');

      // Detect recovery mode. Supabase appends type=recovery to the hash
      // (and the client auto-exchanges it for a session because detectSessionInUrl is true).
      const isRecovery = window.location.hash.includes('type=recovery')
                     || window.location.search.includes('type=recovery');

      if (isRecovery) {
        requestWrap.hidden = true;
        updateWrap.hidden = false;
        cardTitle.textContent = 'Set a New Password';
        cardSub.textContent = 'Choose a strong password you have not used before.';
      }

      // --- Stage 1: request reset link ---
      document.getElementById('btnRequest').addEventListener('click', async () => {
        const errEl = document.getElementById('errorRequest');
        const infoEl = document.getElementById('infoRequest');
        errEl.hidden = true; infoEl.hidden = true;

        const email = document.getElementById('resetEmail').value.trim();
        if (!email) { errEl.textContent = 'Enter your email.'; errEl.hidden = false; return; }

        const btn = document.getElementById('btnRequest');
        const label = btn.querySelector('.btn-label');
        btn.disabled = true; label.textContent = 'Sending…';

        const { error } = await window.KaynAuth.sendPasswordReset(email);

        btn.disabled = false; label.textContent = 'Send Reset Link';

        // Always report success — never reveal whether an email exists.
        if (error) console.error(error);
        infoEl.textContent = 'If that email exists, a reset link is on the way.';
        infoEl.hidden = false;
      });

      // --- Stage 2: submit new password ---
      document.getElementById('updateWrap').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('errorUpdate');
        errEl.hidden = true;

        const pw1 = document.getElementById('newPassword').value;
        const pw2 = document.getElementById('confirmPassword').value;

        if (pw1.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.hidden = false; return; }
        if (pw1 !== pw2)    { errEl.textContent = 'Passwords do not match.'; errEl.hidden = false; return; }

        const btn = updateWrap.querySelector('button[type=submit]');
        const label = btn.querySelector('.btn-label');
        btn.disabled = true; label.textContent = 'Updating…';

        const { error } = await window.KaynAuth.updatePassword(pw1);

        if (error) {
          btn.disabled = false; label.textContent = 'Set New Password';
          errEl.textContent = error.message || 'Could not update password.';
          errEl.hidden = false;
          return;
        }

        // Success — force a fresh sign-in.
        await window.KaynAuth.signOut();
        alert('Password updated. Please sign in with your new password.');
        window.location.href = 'client-login.html';
      });
    })();
  </script>
</body>
</html>
